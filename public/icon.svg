<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#d97706" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="225" r="145" fill="#0f172a" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Utensils / Cloche Graphic -->
  <!-- Plate -->
  <circle cx="256" cy="235" r="110" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="256" cy="235" r="80" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Fork & Spoon crossed -->
  <!-- Fork Left -->
  <path d="M 215 170 L 215 220 C 215 235 225 245 240 250 L 225 310 C 223 318 215 322 208 320" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 205 170 L 205 200 M 215 170 L 215 200 M 225 170 L 225 200" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Spoon Right -->
  <path d="M 297 170 C 285 170 275 185 275 205 C 275 225 285 240 297 240 C 309 240 319 225 319 205 C 319 185 309 170 297 170 Z" fill="url(#gold)"/>
  <path d="M 297 240 L 272 310 C 270 318 278 322 285 320" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- Star Embellishment -->
  <polygon points="256,135 261,148 275,148 264,156 268,169 256,160 244,169 248,156 237,148 251,148" fill="#fbbf24"/>

  <!-- App Label Text -->
  <text x="256" y="415" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#fbbf24" text-anchor="middle" letter-spacing="4">DHKC</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="6">CANTEEN</text>
</svg>
